root = "/app"
working_dir = "/app"
testdata_dir = "testdata"
tmp_dir = "/app/tmp"

[build]
  args_bin = []
  bin = "/app/tmp/gateway"
  cmd = "go build -o /app/tmp/gateway ./cmd/gateway"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "/app/build-errors.log"
  rerun = false
  rerun_delay = 500
  stop_on_error = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false
